name: ci

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  win-debug-min:
    runs-on: windows-2022
    timeout-minutes: 30 # hypothesis; adjust after measured hosted runs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt', 'CMakeLists.txt') }}
      - name: Install test modules
        run: python -m pip install --require-hashes --no-deps --target .cache/pylib -r tools/ci/requirements-test.txt
      - name: Build and test
        shell: cmd
        run: tools\build_min.cmd --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: win-debug-min
          path: build/win-debug-min/junit.xml
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: win-debug-min-failure
          path: build/win-debug-min/Testing/Temporary/LastTest.log
          retention-days: 14

  win-cli:
    runs-on: windows-2022
    timeout-minutes: 120 # hypothesis; includes cold vcpkg dependencies
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Read baseline and compiler
        id: context
        run: |
          "baseline=$(python tools/ci/context.py baseline)" >> $env:GITHUB_OUTPUT
          python tools/ci/context.py compiler-key >> $env:GITHUB_OUTPUT
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/vcpkg-bin
          key: vcpkg-${{ runner.os }}-x64-windows-${{ hashFiles('vcpkg.json') }}-${{ steps.context.outputs.compiler }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-${{ hashFiles('vcpkg.json') }}-
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/vcpkg-assets
          key: vcpkg-assets-${{ runner.os }}-${{ steps.context.outputs.baseline }}
      - name: Bootstrap pinned vcpkg
        shell: cmd
        run: tools\ci\bootstrap_vcpkg.cmd
      - name: Install test modules
        run: python -m pip install --require-hashes --no-deps --target .cache/pylib -r tools/ci/requirements-test.txt
      - name: Build and test
        shell: cmd
        run: tools\build_cli.cmd --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: win-cli
          path: build/win-cli/junit.xml
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: win-cli-failure
          path: build/win-cli/Testing/Temporary/LastTest.log
          retention-days: 14

  linux-min:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # hypothesis; adjust after measured hosted runs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt', 'CMakeLists.txt') }}
      - name: Install test modules
        run: python -m pip install --require-hashes --no-deps --target .cache/pylib -r tools/ci/requirements-test.txt
      - name: Build and test
        run: tools/build_linux.sh min --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-min
          path: build/linux-min/junit.xml
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: linux-min-failure
          path: build/linux-min/Testing/Temporary/LastTest.log
          retention-days: 14

  linux-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 120 # hypothesis; includes cold vcpkg dependencies
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config autoconf automake libtool
      - name: Read baseline and compiler
        id: context
        run: |
          echo "baseline=$(python tools/ci/context.py baseline)" >> "$GITHUB_OUTPUT"
          python tools/ci/context.py compiler-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/vcpkg-bin-linux
          key: vcpkg-${{ runner.os }}-x64-linux-${{ hashFiles('vcpkg.json') }}-${{ steps.context.outputs.compiler }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-linux-${{ hashFiles('vcpkg.json') }}-
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/vcpkg-assets
          key: vcpkg-assets-${{ runner.os }}-${{ steps.context.outputs.baseline }}
      - name: Bootstrap pinned vcpkg
        run: tools/ci/bootstrap_vcpkg.sh
      - name: Install test modules
        run: python -m pip install --require-hashes --no-deps --target .cache/pylib -r tools/ci/requirements-test.txt
      - name: Build and test
        run: tools/build_linux.sh cli --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-cli
          path: build/linux-cli/junit.xml
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: linux-cli-failure
          path: build/linux-cli/Testing/Temporary/LastTest.log
          retention-days: 14
