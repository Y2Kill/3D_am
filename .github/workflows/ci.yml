name: ci

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  win-debug-min:
    runs-on: windows-2022
    timeout-minutes: 30 # hypothesis; adjust after measured hosted runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt', 'CMakeLists.txt') }}
      - name: Install test modules
        run: python -m pip install --require-hashes --no-deps --target .cache/pylib -r tools/ci/requirements-test.txt
      - name: Build and test
        shell: cmd
        run: tools\build_min.cmd --ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: win-debug-min
          path: |
            build/win-debug-min/junit.xml
            build/win-debug-min/req_report.*
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: win-debug-min-failure
          path: build/win-debug-min/Testing/Temporary/LastTest.log
          retention-days: 14

  win-cli:
    runs-on: windows-2022
    timeout-minutes: 120 # hypothesis; includes cold vcpkg dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Read baseline and compiler
        id: context
        run: |
          "baseline=$(python tools/ci/context.py baseline)" >> $env:GITHUB_OUTPUT
          python tools/ci/context.py compiler-key >> $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vcpkg-bin
          key: vcpkg-${{ runner.os }}-x64-windows-${{ hashFiles('vcpkg.json') }}-${{ steps.context.outputs.compiler }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-${{ hashFiles('vcpkg.json') }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vcpkg-assets
          key: vcpkg-assets-${{ runner.os }}-${{ steps.context.outputs.baseline }}
      - name: Bootstrap pinned vcpkg
        shell: cmd
        run: tools\ci\bootstrap_vcpkg.cmd
      - name: Install test modules
        run: python -m pip install --require-hashes --no-deps --target .cache/pylib -r tools/ci/requirements-test.txt
      - name: Build and test
        shell: cmd
        run: tools\build_cli.cmd --ci -LE periodic
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: win-cli
          path: |
            build/win-cli/junit.xml
            build/win-cli/req_report.*
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: win-cli-failure
          path: build/win-cli/Testing/Temporary/LastTest.log
          retention-days: 14

      - name: Upload Windows portability bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-portability
          path: build/e2e/portability/
          if-no-files-found: error
          retention-days: 14

  linux-min:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # hypothesis; adjust after measured hosted runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt', 'CMakeLists.txt') }}
      - name: Install test modules
        run: python -m pip install --require-hashes --no-deps --target .cache/pylib -r tools/ci/requirements-test.txt
      - name: Build and test
        run: tools/build_linux.sh min --ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-min
          path: |
            build/linux-min/junit.xml
            build/linux-min/req_report.*
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-min-failure
          path: build/linux-min/Testing/Temporary/LastTest.log
          retention-days: 14

  linux-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 120 # hypothesis; includes cold vcpkg dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config make perl linux-libc-dev
      - name: Read baseline and compiler
        id: context
        run: |
          echo "baseline=$(python tools/ci/context.py baseline)" >> "$GITHUB_OUTPUT"
          python tools/ci/context.py compiler-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vcpkg-bin-linux
          key: vcpkg-${{ runner.os }}-x64-linux-${{ hashFiles('vcpkg.json') }}-${{ steps.context.outputs.compiler }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-linux-${{ hashFiles('vcpkg.json') }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vcpkg-assets
          key: vcpkg-assets-${{ runner.os }}-${{ steps.context.outputs.baseline }}
      - name: Bootstrap pinned vcpkg
        run: tools/ci/bootstrap_vcpkg.sh
      - name: Install test modules
        run: python -m pip install --require-hashes --no-deps --target .cache/pylib -r tools/ci/requirements-test.txt
      - name: Build and test
        run: tools/build_linux.sh cli --ci -LE periodic
      - name: Real disk-full tests in an isolated tmpfs
        run: |
          # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor;
          # the driver then skips (77) and CTest would count the skip as success.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          TMPDIR="$GITHUB_WORKSPACE/.cache/tmp-linux" ctest --preset linux-cli -L small_volume --output-on-failure --output-junit "$GITHUB_WORKSPACE/build/linux-cli/small_volume.xml"
          if grep -q 'status="notrun"' "$GITHUB_WORKSPACE/build/linux-cli/small_volume.xml"; then
            echo "::error::small_volume was skipped in CI; the real disk-full check did not run"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-cli
          path: |
            build/linux-cli/junit.xml
            build/linux-cli/small_volume.xml
            build/linux-cli/req_report.*
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-cli-failure
          path: build/linux-cli/Testing/Temporary/LastTest.log
          retention-days: 14

  portability-linux:
    needs: win-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 120 # hypothesis; includes cold vcpkg dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config make perl linux-libc-dev
      - name: Read baseline and compiler
        id: context
        run: |
          echo "baseline=$(python tools/ci/context.py baseline)" >> "$GITHUB_OUTPUT"
          python tools/ci/context.py compiler-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vcpkg-bin-linux
          key: vcpkg-${{ runner.os }}-x64-linux-${{ hashFiles('vcpkg.json') }}-${{ steps.context.outputs.compiler }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-linux-${{ hashFiles('vcpkg.json') }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vcpkg-assets
          key: vcpkg-assets-${{ runner.os }}-${{ steps.context.outputs.baseline }}
      - name: Bootstrap pinned vcpkg
        run: tools/ci/bootstrap_vcpkg.sh
      - name: Install test modules
        run: python -m pip install --require-hashes --no-deps --target .cache/pylib -r tools/ci/requirements-test.txt
      - name: Build Linux reader
        run: tools/build_linux.sh cli --ci -R e2e_selftest
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: e2e-portability
          path: build/e2e/portability
      - name: Verify Windows portability bundle
        run: python3 -I tests/e2e/check_portability.py --am build/linux-cli/bin/am --bundle build/e2e/portability --work build/e2e/portability-linux
